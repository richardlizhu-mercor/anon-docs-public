<style>
:root{--brand:#4f46e5;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc}
*{box-sizing:border-box}
html,body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:24px;margin:0 0 2px} h2{font-size:17px;margin:26px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
p{font-size:13.5px;line-height:1.55} code{background:#eef2ff;border-radius:4px;padding:1px 5px;font-size:12px}
table{border-collapse:collapse;font-size:13px;margin:6px 0 4px} th,td{border:1px solid var(--line);padding:5px 9px;text-align:right} th:first-child,td:first-child{text-align:left} thead th{background:#eef2ff}
.win{font-weight:700;color:var(--brand)}
.cap{font-size:11.5px;color:var(--mut);margin:2px 0 10px}

/* explorer */
.exp{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:10px;height:640px}
.side{border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.ctl{padding:10px;border-bottom:1px solid var(--line)}
.ctl label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:8px 0 3px}
.ctl select,.ctl input{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.seg{display:flex;gap:5px;margin-top:3px}.seg button{flex:1;padding:6px 0;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--mut)}.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
#list{overflow:auto;flex:1}
.row{padding:7px 10px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12px}
.row:hover{background:#f8fafc}.row.sel{background:#eef2ff}
.row .did{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dis{float:right;font-variant-numeric:tabular-nums;font-weight:700}
.pane{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto;padding:14px}
.doch{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut);margin-bottom:10px}
.track{margin:9px 0}
.tname{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:2px;display:flex;justify-content:space-between}
.txt{font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:2.0;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fcfcfd}
mark{border-radius:3px;padding:1px 0}
.leg{display:flex;flex-wrap:wrap;gap:5px 12px;margin:6px 0 2px;font-size:11px;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:4px}.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.foot{font-size:11px;color:var(--mut);margin-top:8px}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px}
/*HHC*/.hub-home{text-decoration:none;color:inherit}.hub-home:hover{opacity:.6}.hub-home-block{display:block;text-decoration:none;color:inherit}.hub-home-block:hover h1{color:#4f46e5}/*end HHC*/</style></head><body><div class=wrap>

ted first? we've got two starting next week and I don't want to hand them the whole tree on day one.\n\nmy read is they only need the released SOPs folder plus the current audit trail exports, not the draft/working area. can you sanity check that against what al-Muhairi signed off on last time, since I think that's the precedent we're supposed to follow?\n\nif you can confirm by tomorrow I'll get the ticket filed same day.\n\nthanks\nkas","gt":[[4,8,"Single Name"],[380,390,"Last Name"],[553,556,"Nickname"]],"v53":[[4,8,"Full Name"],[380,390,"Full Name"],[553,556,"Full Name"]],"champ":[[4,8,"Identity*"],[380,390,"Identity*"],[553,556,"Identity*"]],"gem":[[4,8,"Identity*"],[380,390,"Identity*"],[553,556,"Identity*"]],"dis":51,"np":false},{"id":"gmail:emails:bdbefc67-61a3-561c-b293-c4e96eb77012:body_text","svc":"gmail","col":"emails.body_text","sup":"trusted","text":"Hi Guillermo,\n\nWelcome aboard — I'm pulling together the last bits of your onboarding file this week and wanted to get you the mentor assignment before your first day of rotations.\n\nFor your first month of field clinical rotations you'll be paired with one of our senior clinical specialists, who will shadow you on early site visits and sign off on your initial competency checks. I'll send their contact details separately once the calendar invite goes out, but wanted you to have the heads up now so you can plan travel.\n\nOne housekeeping item on my end: I still need to confirm the date of birth on file for your background paperwork — I have it logged as 03.05.1986, could you reply and confirm that's correct?\n\nLet me know if you have any questions before rotations start.\n\nFemi","gt":[[3,12,"Single Name"],[660,670,"Date of Birth"],[780,784,"Nickname"]],"v53":[[3,12,"Full Name"],[660,662,"ID"],[662,670,"Date of Birth"],[780,784,"Full Name"]],"champ":[[3,12,"Identity*"],[780,784,"Identity*"]],"gem":[[3,12,"Identity*"],[660,670,"Date of Birth"],[780,784,"Identity*"]],"dis":51,"np":false},{"id":"gmail:em xt","svc":"gmail","col":"emails.body_text","sup":"trusted","text":"I'm opening a formal review of the specimen records implicated in last month's result-correction incident. This covers the accession, run, and review steps for each affected specimen, plus the audit trail on the corrected results themselves.\n\nI'll be working through the record set over the next few days and will flag anything that doesn't reconcile cleanly. Marchetti, I'd like you looped in from the start given the scope — I'll send the initial record list separately so you have it ahead of any findings.\n\nI can be reached at olam.ext@atlasassay.com if anything needs to move faster than email.\n\n— Ola","gt":[[360,369,"Last Name"],[531,554,"Email Address"],[603,606,"Single Name"]],"v53":[[360,369,"Full Name"],[531,554,"Email Address"],[603,606,"Full Name"]],"champ":[[360,369,"Identity*"],[531,554,"Email Address"],[603,606,"Identity*"]],"gem":[[360,369,"Identity*"],[531,554,"Email Address"],[603,606,"Identity*"]],"dis":36,"np":false},{"id":"gmail:emails:7fa60b28-6874-5cca-9a67-7d7179e83c78:body_text","svc":"gmail","col":"emails.body_text","sup":"trusted","text":"hey Nightowl,\n\ncan you sanity check the backup retention settings on the migrated cluster against what we had before the cutover? i want to make sure nothing got flattened to a default during the move — specifically the 90-day window on the accession db snapshots, that's the one i'm least confident about.\n\nif you've got the old config handy, a quick diff would do. flag anything that doesn't match and i'll open a ticket.\n\nthanks,\nMano","gt":[[4,12,"Nickname"],[433,437,"Nickname"]],"v53":[[4,12,"Full Name"],[433,437,"Full Name"]],"champ":[[4,12,"Identity*"],[433,437,"Organization Name"]],"gem":[[4,12,"Username"],[433,437,"Identity*"]],"dis":36,"np":false},{"id":"gmail:emails:c88ec10c-89e7-5835-8780-924b24a35895:body_text","svc":"gmail","col":"emails.body_text","sup":"trusted","text":"following up — carrier confirmed pickup, so the kit // ---- overview + results ----
function fmt(v){return v.toFixed(3);}
function resultsHTML(){
 const R=DATA.results, rows=[["v53","deberta-pii-v5.3 ep3","v53_ep3"],["champ","champion v5.1/3ep","champion_v51_3ep"],["gem","Gemini pipeline (2.5-flash)","gemini_monorepo_25flash"]];
 const best={detection:0,cluster:0,fine:0,fine_macro:0};
 rows.forEach(([k,_,rk])=>{const r=R[rk];["detection","cluster","fine"].forEach(m=>best[m]=Math.max(best[m],r[m].f1));best.fine_macro=Math.max(best.fine_macro,r.fine_macro);});
 let h=`<h2>Results — 3-way on the container subset (2,999 docs)</h2>
 <div class=cap>char-level P/R/F1 at three strictness levels; scored on the SSOT-corrected container variant. Higher is better; <b class=win>bold</b> = best.</div>
 <table><thead><tr><th>model</th><th>detection F1</th><th>cluster F1</th><th>fine F1</th><th>fine-macro</th></tr></thead><tbody>`;
 rows.forEach(([k,nm,rk])=>{const r=R[rk];
  const cell=(m,val)=>`<td class="${Math.abs(val-best[m])<1e-9?'win':''}">${fmt(val)}</td>`;
  h+=`<tr><td>${nm}</td>`+
   `<td class="${Math.abs(r.detection.f1-best.detection)<1e-9?'win':''}">${fmt(r.detection.f1)} <span style=color:#94a3b8>P${fmt(r.detection.p)}/R${fmt(r.detection.r)}</span></td>`+
   cell('cluster',r.cluster.f1)+cell('fine',r.fine.f1)+cell('fine_macro',r.fine_macro)+`</tr>`;});
 h+=`</tbody></table>`;
 // per-type fine F1 across models
 const types=new Set();rows.forEach(([,,rk])=>Object.keys(R[rk].per_type).forEach(t=>{if(R[rk].per_type[t].tp+R[rk].per_type[t].fn>0)types.add(t);}));
 const gtsize=t=>{let m=0;rows.forEach(([,,rk])=>{const pt=R[rk].per_type[t];if(pt)m=Math.max(m,pt.tp+pt.fn);});return m;};
 const tl=[...types].filter(t=>CLUSTER[t]&&t.indexOf("*")<0).sort((a,b)=>gtsize(b)-gtsize(a));
 h+=`<h2>Per-type fine F1</h2><div class=cap>where each detector types spans correctly. 0.000 = the model has no such class (e.g. v5.3 has no Institution; champion & Gemini emit coarse person labels so subtypes read 0).</div>
 <table><thead><tr><th>type</th><th>gt chars</th><th>v5.3</th><th>champion</th><th>Gemini</th></tr></thead><tbody>`;
 tl.forEach(t=>{const g=R["v53_ep3"].per_type[t]||{},c=R["champion_v51_3ep"].per_type[t]||{},m=R["gemini_monorepo_25flash"].per_type[t]||{};
  const f=x=>x&&(x.tp+x.fn+x.fp)?fmt(x.f1):'—';const bestv=Math.max(g.f1||0,c.f1||0,m.f1||0);
  const cc=x=>`<td class="${x&&Math.abs((x.f1||0)-bestv)<1e-9&&bestv>0?'win':''}">${f(x)}</td>`;
  h+=`<tr><td>${short(t)}</td><td>${gtsize(t).toLocaleString()}</td>${cc(g)}${cc(c)}${cc(m)}</tr>`;});
 h+=`</tbody></table>
 <h2>Per-service detection F1</h2><table><thead><tr><th>service</th><th>v5.3</th><th>champion</th><th>Gemini</th></tr></thead><tbody>`;
 ["gmail","linear","slack"].forEach(s=>{const g=R["v53_ep3"].per_source[s],c=R["champion_v51_3ep"].per_source[s],m=R["gemini_monorepo_25flash"].per_source[s];
  h+=`<tr><td>${s}</td><td>${fmt(g.f1)}</td><td>${fmt(c.f1)}</td><td>${fmt(m.f1)}</td></tr>`;});
 h+=`</tbody></table>`;
 return h;
}
function overviewHTML(){
 return `<h2>What SynthBench is</h2>
 <p>A PII-detection benchmark in the same one-cell-per-doc char-span shape as <b>contigo-bench</b> / <b>pii-bench</b>, built from a synthetic <code>agentic_company</code> run. Ground truth is <b>exact by construction</b> — code (not a model) placed every PII literal and recorded its char offsets, and the builder re-proves every span by re-slicing the published cell (0 mismatches). <code>doc_id = service:table:row_id:column</code>.</p>
 <p>Two variants over the identical doc set: <b>leaves</b> (native 14-type; emails/URLs decomposed into their PII parts) and <b>container</b> (16-type; the SSOT carrier slots <code>email</code>→Email Address and <code>url</code>/<code>web_domain</code>→Web URL collapse to whole spans, every other composite keeps its leaf parts). Negatives are structural cells with no PII span (prose columns excluded); every doc is tagged <code>supervision</code> = exact | trusted. Published to <code>s3://data-acq-raw-prod/_training_eval_data/detection/synthbench-v1/</code>.</p>
 <p style="color:#b45309"><b>Caveats:</b> this company emitted 0 Street Address / 0 GPS and very few Brand/Middle/Last, so the type mix is one-company. The source run's fitness verdict is UNFIT — but every blocking failure is an identity-resolution/clustering invariant; the detection spans/offsets are exact and unaffected. The results below are on the container variant, a 2,999-doc balanced subset (Gemini run on the subset for cost).</p>`;
}

let S={svc:"all",dis:"disagree",models:{v53:1,champ:1,gem:1},q:"",sel:null};
function filtered(){
 return DATA.docs.filter(d=>{
  if(S.svc!=="all"&&d.svc!==S.svc)return false;
  if(S.dis==="disagree"&&d.dis===0)return false;
  if(S.dis==="pii"&&d.np)return false;
  if(S.q&&d.text.toLowerCase().indexOf(S.q)<0&&d.id.toLowerCase().indexOf(S.q)<0)return false;
  return true;});
}
function renderList(){
 const fs=filtered();
 el('count').textContent=fs.length.toLocaleString()+" docs";
 el('list').innerHTML=fs.slice(0,600).map(d=>
  `<div class="row ${d.id===S.sel?'sel':''}" data-id="${esc(d.id)}"><span class=dis>${d.dis}</span><div>${esc(d.svc)} · ${esc(short2(d.col))}</div><div class=did>${esc(d.id.split(':').slice(2).join(':'))}</div></div>`).join('')
  +(fs.length>600?`<div class=row style=color:#94a3b8>…${(fs.length-600).toLocaleString()} more (filter/search to narrow)</div>`:'');
 el('list').querySelectorAll('.row[data-id]').forEach(n=>n.onclick=()=>{S.sel=n.dataset.id;renderList();renderDoc();});
 if(!S.sel&&fs.length)S.sel=fs[0].id;
}
function short2(c){return c.length>26?c.slice(0,26)+"…":c;}
function band(text,spans,cmpGT){ // render text with spans as <mark>, colored; if cmpGT given, color by correctness
 const gt=cmpGT; const chars=[...text];
 // build per-char type for this source + gt
 const smap={},gmap={};
 spans.forEach(([s,e,t])=>{for(let i=s;i<e;i++)smap[i]=t;});
 if(gt)gt.forEach(([s,e,t])=>{for(let i=s;i<e;i++)gmap[i]=t;});
 let out="",i=0,N=chars.length;
 while(i<N){
  const t=smap[i];
  if(t===undefined){out+=esc(chars[i]);i++;continue;}
  let j=i;while(j<N&&smap[j]===t)j++;
  const seg=esc(chars.slice(i,j).join(''));
  const cl=CLUSTER[t]||"FP",rgb=CCOL[cl]||[100,116,139];
  let bg=`rgba(${rgb.join(',')},0.22)`,bd="transparent",title=t;
  if(gt){ // correctness vs GT across the segment
   let tp=0,typ=0,fp=0;for(let k=i;k<j;k++){const gtk=gmap[k];if(gtk===undefined)fp++;else if(gtk===t)tp++;else typ++;}
   if(fp>=tp&&fp>=typ){bd="#ef4444";title=t+" — not PII in GT (FP)";}       // red = false positive
   else if(typ>tp){bd="#f59e0b";title=t+" — type differs from GT";}          // amber = type mismatch
   else{bd="#10b981";title=t+" — matches GT";}                               // green = correct
  }
  out+=`<mark style="background:${bg};box-shadow:inset 0 -2px 0 ${bd}" title="${esc(title)}">${seg}</mark>`;
  i=j;
 }
 // GT-only (missed) chars: underline dotted where GT has a type this source doesn't cover
 return out;
}
function spanChips(spans){const c={};spans.forEach(([,,t])=>c[t]=(c[t]||0)+1);return Object.keys(c).sort().map(t=>{const cl=CLUSTER[t]||"FP",rgb=CCOL[cl]||[100,116,139];return `<span class=badge style="background:rgba(${rgb.join(',')},0.18);color:rgb(${rgb.join(',')})">${esc(short(t))}·${c[t]}</span>`;}).join('');}
function statsVsGT(spans,gt){const g={},s={};gt.forEach(([a,b,t])=>{for(let i=a;i<b;i++)g[i]=t;});spans.forEach(([a,b,t])=>{for(let i=a;i<b;i++)s[i]=t;});
 let tp=0,ty=0,fp=0,fn=0;new Set([...Object.keys(g),...Object.keys(s)]).forEach(c=>{const gc=g[c],sc=s[c];if(sc!==undefined&&gc!==undefined){sc===gc?tp++:ty++;}else if(sc!==undefined)fp++;else fn++;});
 return {tp,ty,fp,fn};}
function statBadges(st){return `<span title="chars matching GT type" style="font-weight:700;font-size:10px;color:#10b981">✓${st.tp}</span> <span title="covered but wrong type" style="font-size:10px;color:#d97706">~${st.ty}</span> <span title="predicted where GT has no PII (false positive)" style="font-size:10px;color:#ef4444">✗${st.fp}</span> <span title="GT PII this model missed" style="font-size:10px;color:#94a3b8">·${st.fn} missed</span>`;}
function miniScorecard(){const R=DATA.results,rows=[["deberta-v5.3 ep3","v53_ep3"],["champion v5.1","champion_v51_3ep"],["Gemini pipeline","gemini_monorepo_25flash"]];
 const best={d:0,f:0,m:0};rows.forEach(([,rk])=>{best.d=Math.max(best.d,R[rk].detection.f1);best.f=Math.max(best.f,R[rk].fine.f1);best.m=Math.max(best.m,R[rk].fine_macro);});
 const w=(v,b)=>Math.abs(v-b)<1e-9?' class=win':'';
 return `<table style="margin:0 0 10px;max-width:620px"><thead><tr><th>model — subset performance</th><th>detection F1</th><th>fine F1</th><th>fine-macro</th></tr></thead><tbody>`+
 rows.map(([nm,rk])=>{const r=R[rk];return `<tr><td>${nm}</td><td${w(r.detection.f1,best.d)}>${r.detection.f1.toFixed(3)} <span style=color:#94a3b8>P${r.detection.p.toFixed(2)}/R${r.detection.r.toFixed(2)}</span></td><td${w(r.fine.f1,best.f)}>${r.fine.f1.toFixed(3)}</td><td${w(r.fine_macro,best.m)}>${r.fine_macro.toFixed(3)}</td></tr>`;}).join('')+`</tbody></table>`;}
function renderDoc(){
 const d=DATA.docs.find(x=>x.id===S.sel);if(!d){el('pane').innerHTML='<div class=foot>Select a doc.</div>';return;}
 let h=`<div class=doch>${esc(d.id)} &nbsp; <span class=badge style="background:#eef2ff;color:#4f46e5">${d.sup}</span> &nbsp; disagreement chars: <b>${d.dis}</b></div>`;
 h+=`<div class=leg>`+Object.entries({ID:'Identity',ST:'Street',IN:'Institution',FP:'Determ-FPR',WEB:'Web'}).map(([k,v])=>`<span><i class=sw style="background:rgb(${CCOL[k].join(',')})"></i>${v}</span>`).join('')
   +` &nbsp;|&nbsp; <span><i class=sw style="box-shadow:inset 0 -2px 0 #10b981;background:#fff"></i>matches GT</span><span><i class=sw style="box-shadow:inset 0 -2px 0 #f59e0b;background:#fff"></i>type differs</span><span><i class=sw style="box-shadow:inset 0 -2px 0 #ef4444;background:#fff"></i>false positive</span></div>`;
 // GT track
 h+=`<div class=track><div class=tname><span>Ground truth</span><span>${spanChips(d.gt)}</span></div><div class=txt>${band(d.text,d.gt,null)}</div></div>`;
 [["v53","deberta-pii-v5.3 ep3"],["champ","champion v5.1/3ep"],["gem","Gemini (monorepo)"]].forEach(([k,nm])=>{
  if(!S.models[k])return;
  h+=`<div class=track><div class=tname><span>${nm} &nbsp; ${statBadges(statsVsGT(d[k],d.gt))}</span><span>${spanChips(d[k])}</span></div><div class=txt>${band(d.text,d[k],d.gt)}</div></div>`;
 });
 el('pane').innerHTML=h;
}
function explorerHTML(){
 return `<h2>Span explorer — where the models disagree</h2>
 <div class=cap>Each doc's cell text is shown once per source (GT + the 3 detectors). Highlight <b>fill</b> = PII cluster; the <b>underline</b> on each model row grades it against GT — <span style="color:#10b981">green</span> correct type, <span style="color:#f59e0b">amber</span> type differs, <span style="color:#ef4444">red</span> false positive. Docs are sorted by disagreement (chars where a model ≠ GT); default filter shows only docs with disagreement. Each model track also shows its per-doc scoreline vs GT — <b style="color:#10b981">✓ correct</b> / <b style="color:#d97706">~ type-diff</b> / <b style="color:#ef4444">✗ false-positive</b> / <b style="color:#94a3b8">missed</b> chars. Hover a highlight for its type.</div>
 ${miniScorecard()}
 <div class=exp>
  <div class=side>
   <div class=ctl>
    <label>Service</label><select id=fsvc><option value=all>all</option><option>gmail</option><option>linear</option><option>slack</option></select>
    <label>Show</label><div class=seg id=fdis><button data-v=disagree class=on>disagreements</button><button data-v=pii>has PII</button><button data-v=all>all</button></div>
    <label>Models</label><div class=seg id=fmod><button data-k=v53 class=on>v5.3</button><button data-k=champ class=on>champion</button><button data-k=gem class=on>Gemini</button></div>
    <label>Search text / id</label><input id=fq placeholder="substring…">
    <div class=foot id=count></div>
   </div>
   <div id=list></div>
  </div>
  <div class=pane id=pane></div>
 </div>`;
}
el('app').innerHTML=overviewHTML()+resultsHTML()+explorerHTML();
el('fsvc').onchange=e=>{S.svc=e.target.value;renderList();renderDoc();};
el('fq').oninput=e=>{S.q=e.target.value.trim().toLowerCase();renderList();renderDoc();};
el('fdis').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.dis=b.dataset.v;el('fdis').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderList();renderDoc();});
el('fmod').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.models[b.dataset.k]=!S.models[b.dataset.k];b.classList.toggle('on',S.models[b.dataset.k]);renderDoc();});
renderList();renderDoc();
</script><script data-goatcounter="https://richardlizhu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
