<style>

 *{box-sizing:border-box}

 #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px 20px}

   border-radius:10px;padding:12px;overflow:hidden}
 .card h2{margin:0 0 8px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
 .fam{font-weight:700}
 .cid{color:var(--slate600);font-weight:400;font-family:ui-monospace,monospace;font-size:11px;
   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .surf{display:flex;flex-wrap:wrap;gap:6px}
 .s{background:var(--slate100);border-radius:6px;padding:3px 8px;font-size:13px;max-width:100%;
   overflow:hidden;text-overflow:ellipsis}
 .s .t{color:var(--slate600);font-size:10px;margin-left:6px}
 #empty{padding:40px 20px;color:var(--slate600)}
 .warn{color:#b91c1c;font-size:11px;margin-top:6px}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const FAMCOL = {"Identity": "#4f46e5", "Institution": "#0d9488", "Street": "#d97706"};
const grid = document.getElementById("grid"), empty = document.getElementById("empty");
let famFilter = null;

document.getElementById("title").textContent = DATA.title;
(function stats(){
  const s = DATA.stats, box = document.getElementById("stats");
  const chip = (label, val) => { const c=document.createElement("span"); c.className="chip";
    const b=document.createElement("b"); b.textContent=String(val); c.append(label+" ", b); return c; };
  box.append(chip("clusters", s.clusters), chip("surfaces", s.surfaces),
             chip("mean size", s.mean_size), chip("max", s.max_size));
  for (const [f,n] of Object.entries(s.families)) {
    const c = chip(f, n); c.style.color = FAMCOL[f] || "#475569"; box.append(c);
  }
  const fams = document.getElementById("fams");
  const mk = (label,val) => { const btn=document.createElement("button"); btn.textContent=label;
    btn.onclick=()=>{ famFilter = (famFilter===val)?null:val;
      [...fams.children].forEach(b=>b.classList.toggle("on", b===btn && famFilter===val)); render(); }; return btn; };
  fams.append(mk("all",null));
  for (const f of Object.keys(s.families)) fams.append(mk(f,f));
  document.getElementById("warn").textContent = DATA.pii_warning;
})();

function card(c){
  const el=document.createElement("div"); el.className="card";
  el.style.borderLeftColor = FAMCOL[c.family] || "#94a3b8";
  const h=document.createElement("h2");
  const fam=document.createElement("span"); fam.className="fam"; fam.textContent=c.family+" ("+c.size+")";
  fam.style.color = FAMCOL[c.family] || "#475569";
  const id=document.createElement("span"); id.className="cid"; id.textContent=c.id; id.title=c.id;
  h.append(fam,id); el.append(h);
  const wrap=document.createElement("div"); wrap.className="surf";
  for (const s of c.surfaces){
    const sp=document.createElement("span"); sp.className="s"; sp.textContent=s.value; sp.title=s.value;
    if (s.type){ const t=document.createElement("span"); t.className="t"; t.textContent=s.type; sp.append(t); }
    wrap.append(sp);
  }
  el.append(wrap); return el;
}

function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const sort=document.getElementById("sort").value;
  let cs = DATA.clusters.filter(c => (!famFilter || c.family===famFilter));
  if (q) cs = cs.filter(c => c.id.toLowerCase().includes(q) || c.family.toLowerCase().includes(q)
      || c.surfaces.some(s => s.value.toLowerCase().includes(q)));
  cs = cs.slice().sort((a,b)=> sort==="id" ? a.id.localeCompare(b.id)
      : sort==="size_asc" ? a.size-b.size : b.size-a.size);
  grid.replaceChildren(...cs.map(card));
  empty.hidden = cs.length>0;
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
render();
</script><script data-goatcounter="https://richardlizhu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
